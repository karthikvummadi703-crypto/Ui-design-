# Automated Pipeline deployment rules for Google Cloud Build and Cloud Run
steps:
  # Step 1: Build the optimized container image with Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/civicpulse-ui:latest', '.']

  # Step 2: Push the image to GCP Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/civicpulse-ui:latest']

  # Step 3: Deploy to managed Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'civicpulse-ui'
      - '--image'
      - 'gcr.io/$PROJECT_ID/civicpulse-ui:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/civicpulse-ui:latest'
